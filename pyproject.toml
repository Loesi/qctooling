[project]
name = "qctooling"
version = "0.1.0"
description = "Tooling to spare QC output files and functions to generate common derived values"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.15", "ninja"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.version = ">=3.15"
cmake.args = ["-GNinja"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
exclude = [
    "include/*",
    "lib/*",
    "lib/cmake/**",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipython>=9.16.1",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]
